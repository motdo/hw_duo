<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주소록 프로젝트</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<header>
    <h1>주소록 시스템</h1>

    <nav>
        {% if g.user %}
            <span>{{ g.user.username }}님</span>
            <a href="{{ url_for('auth.logout') }}">로그아웃</a>
        {% endif %}
    </nav>
</header>

<main>
    {% block content %}{% endblock %}
</main>

</body>
</html>
